name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: agentic-admin

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready 
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --all-extras --dev
      - name: unit tests
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
        run: uv run pytest -q
  
  evals:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --all-extras --dev
      - name: eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
        run: uv run python -m evals.datasets && uv run python -m evals.run
  
  build:
    needs: evals
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: build and push app image
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run : |
          docker build -t $REG/$ECR_REPO:${{ github.sha }} -t $REG/$ECR_REPO:latest .
          docker push $REG/$ECR_REPO:${{ github.sha }}
          docker push $REG/$ECR_REPO:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - name: apply environment variables
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          put() {
            id=$(aws secretsmanager list-secrets \
              --filters Key=name,Values="$1" \
              --query 'SecretList[0].ARN' --output text)
            aws secretsmanager put-secret-value --secret-id "$id" --secret-string "$2"
          }
          put agentic-admin/openai_api_key    "$OPENAI_API_KEY"
          put agentic-admin/langsmith_api_key "$LANGSMITH_API_KEY"
      - name: force new deployment
        run: |
          aws ecs update-service --cluster agentic-admin-cluster --service agentic-admin-app-svc --force-new-deployment --region ${{ env.AWS_REGION }}
        


